trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Use Node.js'

  - script: npm install
    workingDirectory: backend
    displayName: 'Install backend dependencies'

  - script: npm run lint
    workingDirectory: backend
    displayName: 'Lint backend'

  - script: npm test
    workingDirectory: backend
    displayName: 'Run backend tests'